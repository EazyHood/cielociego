[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cielociego"
version = "0.1.0"
description = "Cuanto tiempo el satelite optico no puede ver un predio, y si el radar cubre el hueco"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jhonatan del Rio" }]
keywords = ["teledeteccion", "sentinel-2", "sentinel-1", "nubosidad", "agricultura", "tropico"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
]
dependencies = [
  "requests>=2.31",
  "numpy>=1.24",
  "shapely>=2.0",
  "rasterio>=1.3",
  "pyproj>=3.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
cielociego = "cielociego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
