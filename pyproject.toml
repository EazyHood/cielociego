[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cielociego"
version = "0.1.0"
description = "Cuanto tiempo el satelite optico no puede ver un predio, y si el radar cubre el hueco"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jhonatan del Rio" }]
keywords = ["teledeteccion", "sentinel-2", "sentinel-1", "nubosidad", "agricultura", "tropico"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: GIS",
  "License :: OSI Approved :: MIT License",
]
# Cotas por ARRIBA a proposito. Una herramienta que dice "esto se reproduce"
# no puede depender de que la proxima mayor de rasterio o numpy no rompa nada:
# el limite superior convierte una rotura silenciosa en un fallo de instalacion,
# que se ve.
dependencies = [
  "requests>=2.31,<3",
  "urllib3>=1.26,<3",
  "numpy>=1.24,<3",
  "shapely>=2.0,<3",
  "rasterio>=1.3,<2",
  "pyproj>=3.5,<4",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<10",
  "pytest-cov>=4.1,<8",
  "mypy>=1.8,<2",
  "ruff>=0.3,<1",
]

[project.scripts]
cielociego = "cielociego.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cielociego = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
  "E731",   # lambdas con nombre en las pruebas: leen mejor que un def de una linea
  "RUF001", # los textos van en espanol; los acentos no son homoglifos sospechosos
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Los constructores llevan CSS y HTML como texto. Partir una regla de CSS
# para que quepa en 100 columnas la hace mas dificil de leer, no menos, y
# una etiqueta <meta> partida en dos deja de poder buscarse. El limite se
# levanta SOLO ahi, y el resto de reglas siguen aplicando.
"herramientas/*" = ["E501"]

[tool.mypy]
# Sin python_version fijo: los stubs de numpy usan sintaxis de 3.12 y
# fijarlo en 3.10 aborta el chequeo antes de mirar nuestro codigo.
ignore_missing_imports = true
warn_unused_ignores = true
