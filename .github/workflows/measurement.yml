name: medicion reproducible

# Comprueba de verdad lo que promete el README: que la medicion se rehace
# desde cero contra los servicios publicos. Toca la red, asi que va aparte
# y a mano o una vez por semana: si falla, no es que el codigo este roto,
# es que cambio el catalogo -- y eso tambien hay que enterarse.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Solo el catalogo (rapido, ya destapa si cambio el STAC)
        run: python -m cielociego catalogo --desde 2024-01-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: salidas
          path: outputs/
